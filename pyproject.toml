[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "livecast-hud"
version = "0.1.0"
description = "Live English subtitles for Korean talks, shown on top of your slides (macOS)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Kunwoo Kim"}]
keywords = ["subtitles", "captions", "speech-to-text", "translation", "presentation", "korean"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PyQt6",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[project.optional-dependencies]
gcp = ["google-cloud-speech", "google-auth", "requests", "sounddevice"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/adalgu/livecast-hud"
Issues = "https://github.com/adalgu/livecast-hud/issues"

[project.scripts]
livecast-hud = "livecast_hud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
